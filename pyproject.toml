[tool.poetry]
name = "scdatatools"
version = "1.0.3"
description = "Python tools for working with Star Citizen data files."
repository = "https://gitlab.com/scmodding/frameworks/scdatatools"
authors = [
    "ventorvar <ventorvar@gmail.com>",
    "th3st0rmtr00p3r <th3st0rmtr00p3r@tkdomain.org>",
    "VMXEO <>",
    "Travis Law <>",]
license = "MIT"
readme = ["README.rst", "HISTORY.rst"]
keywords= ["scdatatools",]
packages = [
    { include = "scdatatools" }
]
include = ["LICENSE"]
classifiers=[
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
]

[tool.poetry.dependencies]
python = "^3.10"
fnvhash = "^0.1.0"
hexdump = "^3.3"
humanize = "^4.11.0"
numpy = "^2.1.2"
packaging = "^24.1"
pycryptodome = "^3.21.0"
pyquaternion = "^0.9.9"
pyrsi = "^0.1.19"
rich = "^13.9.3"
sentry-sdk = "^2.17.0"
tqdm = "^4.66.6"
xxhash = "^3.5.0"
zstandard = "^0.23.0"
python-nubia = {git = "https://gitlab.com/tmlaw/python-nubia.git"}

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
Sphinx = "^8.1.3"
sphinx-autodoc-typehints = "^2.5.0"

[tool.poetry.scripts]
scdt = "scdatatools.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
