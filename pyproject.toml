[project]
name = "scdatatools"
version = "1.0.5"
description = "Python tools for working with Star Citizen data files."
authors = [
    {name = "ventorvar", email = "ventorvar@gmail.com"},
    {name = "th3st0rmtr00p3r", email = "th3st0rmtr00p3r@tkdomain.org"},
    {name = "VMXEO"},
    {name = "Travis Law"},
]
license = {file = "LICENSE"}
readme = "README.rst"
keywords= ["scdatatools","star citizen", "CIG", "cloud imperium games", "squadron42"]
#packages = [
#    { include = "scdatatools" }
#]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fnvhash~=0.1.0",
    "hexdump~=3.3",
    "humanize~=4.11.0",
    "numpy==1.24.3",
    "packaging~=24.1",
    "pillow~=11.0.0",
    "pycryptodome~=3.21.0",
    "pynubia~=0.3.0",
    "pyquaternion~=0.9.9",
    "pyrsi~=0.1.19",
    "rich~=13.9.4",
    "sentry-sdk~=2.18.0",
    "tqdm~=4.66.6",
    "xxhash~=3.5.0",
    "zstandard~=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython>=8.29.0",
    "ruff>=0.7.2",
]

[project.scripts]
scdt = "scdatatools.cli:main"

[project.urls]
Homepage = "https://gitlab.com/scmodding/frameworks/scdatatools"
Documentation = "https://scdatatools.readthedocs.io/en/latest/"
Repository = "https://gitlab.com/scmodding/frameworks/scdatatools"
Issues = "https://gitlab.com/scmodding/frameworks/scdatatools/-/issues"
Changelog = "https://gitlab.com/scmodding/frameworks/scdatatools/-/blob/devel/HISTORY.rst"
